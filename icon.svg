<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background — Google blue, full bleed so maskable crop looks clean -->
  <rect width="512" height="512" fill="#1a73e8"/>
  <!-- Rounded corners for non-maskable display -->
  <rect width="512" height="512" rx="96" fill="#1a73e8"/>

  <!-- Metronome body (trapezoid) -->
  <path d="M148 430 L198 110 L314 110 L364 430 Z"
        fill="none" stroke="#ffffff" stroke-width="20" stroke-linejoin="round"/>

  <!-- Vertical centre guide -->
  <line x1="256" y1="118" x2="256" y2="422"
        stroke="rgba(255,255,255,0.25)" stroke-width="6"/>

  <!-- Pendulum rod (angled right) -->
  <line x1="256" y1="390" x2="318" y2="210"
        stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>

  <!-- Sliding weight -->
  <rect x="287" y="262" width="62" height="28" rx="7" fill="#ffffff"/>

  <!-- Pivot dot -->
  <circle cx="256" cy="390" r="15" fill="#ffffff"/>

  <!-- Tick marks at top -->
  <line x1="222" y1="148" x2="222" y2="170" stroke="rgba(255,255,255,0.75)" stroke-width="7" stroke-linecap="round"/>
  <line x1="256" y1="138" x2="256" y2="165" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <line x1="290" y1="148" x2="290" y2="170" stroke="rgba(255,255,255,0.75)" stroke-width="7" stroke-linecap="round"/>
</svg>
