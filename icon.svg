<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#181818"/>

  <!-- Metronome body (trapezoid outline) -->
  <path d="M148 430 L198 110 L314 110 L364 430 Z"
        fill="none" stroke="#d4911a" stroke-width="20" stroke-linejoin="round"/>

  <!-- Vertical centre guide -->
  <line x1="256" y1="118" x2="256" y2="422"
        stroke="#2e2e2e" stroke-width="6"/>

  <!-- Pendulum rod (angled right) -->
  <line x1="256" y1="390" x2="318" y2="210"
        stroke="#e6e2d8" stroke-width="12" stroke-linecap="round"/>

  <!-- Sliding weight -->
  <rect x="287" y="264" width="62" height="26" rx="6" fill="#d4911a"/>

  <!-- Pivot / base dot -->
  <circle cx="256" cy="390" r="14" fill="#d4911a"/>

  <!-- Tick marks at top -->
  <line x1="222" y1="148" x2="222" y2="168" stroke="#d4911a" stroke-width="7" stroke-linecap="round"/>
  <line x1="256" y1="140" x2="256" y2="165" stroke="#d4911a" stroke-width="7" stroke-linecap="round"/>
  <line x1="290" y1="148" x2="290" y2="168" stroke="#d4911a" stroke-width="7" stroke-linecap="round"/>
</svg>
